<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>natissy Insert</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    background: #2a2a2a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .preview-scaler { transform-origin: center center; }
  @page { size: 4in 6in; margin: 0; }
  @media print {
    html, body { background: #fff; width: auto; height: auto; overflow: visible; display: block; }
    .preview-scaler { transform: none !important; }
  }

  .insert {
    width: 600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 75% 55% at 50% 32%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(0,0,0,0.10) 0%, transparent 60%),
      #FDFAF6;
    font-family: 'Lato', sans-serif;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  .accent-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, #A5C49A, #CFE7B2 40%, #E7A17A 70%, #A5C49A);
    z-index: 10;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 44px 52px 44px;
    box-sizing: border-box;
  }

  .logo-area {
    flex-shrink: 0;
  }

  .hook-group {
    flex-shrink: 0;
    margin-top: 22px;
  }
  .hook {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1.1;
    color: #3D2B1F;
    letter-spacing: -0.8px;
  }
  .hook .accent { color: #E7A17A; }
  .hook-sub {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #9A7E5C;
    margin-top: 9px;
    letter-spacing: 0.2px;
  }

  .spacer { flex: 1; min-height: 12px; }

  .cards-section {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
  }
  .card {
    flex: 1;
    background: rgba(165, 196, 154, 0.09);
    border-radius: 14px;
    border: 1px solid rgba(165, 196, 154, 0.28);
    padding: 16px 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .card-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #3D2B1F;
    text-align: center;
    line-height: 1.25;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(165,196,154,0.45), rgba(231,161,122,0.3), transparent);
    margin: 18px 0 15px;
    flex-shrink: 0;
  }

  .bottom-group {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cta-block {
    width: 100%;
    background: rgba(165, 196, 154, 0.08);
    border: 1.5px solid #A5C49A;
    border-radius: 13px;
    display: flex;
    align-items: center;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .cta-icon-zone {
    width: 62px;
    min-height: 72px;
    background: #A5C49A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cta-label-zone {
    flex: 1;
    padding: 12px 14px;
  }
  .cta-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: #A5C49A;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    line-height: 1;
  }
  .cta-subtitle {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: #9A7E5C;
    margin-top: 4px;
    line-height: 1.3;
  }
  .cta-count-zone {
    width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    flex-shrink: 0;
  }
  .cta-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #3D2B1F;
    line-height: 1;
  }
  .cta-unit {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: #9A7E5C;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 1px;
  }

  .qr-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }
  .qr-img { display: block; width: 158px; height: 158px; }
  .qr-url {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #4B7A18;
    text-align: center;
  }
  .support-line {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: #9A7E5C;
    opacity: 0.5;
    text-align: center;
    margin-top: 5px;
  }
</style>
</head>
