<title>natissy Panty Liner Care Guide Insert</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    background: #2a2a2a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Titillium Web', sans-serif;
  }
  .preview-scaler { transform-origin: center center; }
  @page { size: 4in 6in; margin: 0; }
  @media print {
    html, body { background: #fff; width: auto; height: auto; overflow: visible; display: block; }
    .preview-scaler { transform: none !important; }
  }
  .insert {
    position: relative;
    width: 600px;
    height: 900px;
    background:
      radial-gradient(ellipse 75% 55% at 50% 32%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(0,0,0,0.05) 0%, transparent 60%),
      #FFFFFF;
    overflow: hidden;
    box-sizing: border-box;
  }
  .top-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #A5C49A 0%, #E7A17A 50%, #A5C49A 100%);
    z-index: 3;
  }
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 48px 54px;
    box-sizing: border-box;
  }
  .logo-area {
    display: inline-block;
    align-self: flex-start;
    margin-bottom: 14px;
  }
  .logo-name {
    font-weight: 900;
    font-size: 27px;
    color: #3D7A30;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .logo-tagline {
    font-weight: 600;
    font-size: 10px;
    color: #E7A17A;
    letter-spacing: 2.8px;
    text-transform: uppercase;
    line-height: 1;
    margin-top: 3px;
  }
  .guide-label {
    font-size: 12px;
    font-weight: 400;
    color: #3D2B1F;
    opacity: 0.42;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .hook {
    font-weight: 900;
    font-size: 37px;
    color: #3D2B1F;
    line-height: 1.15;
    margin: 0;
    padding: 0;
  }
  .hook .accent { color: #E7A17A; }
  .spacer { flex: 1; min-height: 20px; }
  .fact-card {
    background: rgba(165,196,154,0.06);
    border: 1px solid rgba(165,196,154,0.28);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 0;
  }
  .fact-img {
    width: 155px;
    min-width: 155px;
    object-fit: cover;
    display: block;
    border-radius: 0;
  }
  .fact-img-placeholder {
    width: 155px;
    min-width: 155px;
    background: rgba(165,196,154,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fact-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    padding: 24px 22px;
    text-align: left;
  }
  .fact-eyebrow {
    font-size: 10px;
    font-weight: 700;
    color: #A5C49A;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .fact-text {
    font-size: 18px;
    font-weight: 700;
    color: #3D2B1F;
    line-height: 1.35;
  }
  .fact-text .accent { color: #E7A17A; }
  .more-hint {
    text-align: center;
    font-size: 13px;
    font-weight: 400;
    color: #9A7E5C;
    margin-top: 14px;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(165,196,154,0.45), transparent);
    margin: 0 0 16px;
  }
  .scan-label {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #A5C49A;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .qr-block {
    border: 1.5px solid rgba(165,196,154,0.7);
    border-radius: 16px;
    background: rgba(165,196,154,0.04);
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .qr-block img {
    width: 164px;
    height: 164px;
    display: block;
  }
  .qr-url {
    font-size: 14px;
    font-weight: 600;
    color: #3D2B1F;
    text-align: center;
    opacity: 0.65;
    letter-spacing: 0.2px;
  }
  .support {
    text-align: center;
    font-size: 11px;
    font-weight: 300;
    color: #3D2B1F;
    opacity: 0.2;
    margin-top: 10px;
  }
</style>

<script>
function fitToScreen() {
  var el = document.querySelector('.preview-scaler');
  var insert = document.querySelector('.insert');
  var scaleX = (window.innerWidth - 40) / insert.offsetWidth;
  var scaleY = (window.innerHeight - 40) / insert.offsetHeight;
  var scale = Math.min(scaleX, scaleY, 1);
  el.style.transform = 'scale(' + scale + ')';
}
fitToScreen();
window.addEventListener('resize', fitToScreen);
</script>
