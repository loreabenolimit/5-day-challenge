<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>natissy Insert</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    background: #2a2a2a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .preview-scaler { transform-origin: center center; }
  @page { size: 4in 6in; margin: 0; }
  @media print {
    html, body { background: #fff; width: auto; height: auto; overflow: visible; display: block; }
    .preview-scaler { transform: none !important; }
  }

  .insert {
    width: 600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 75% 55% at 50% 32%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 100% 100% at 50% 100%, rgba(0,0,0,0.10) 0%, transparent 60%),
      #FDFAF6;
    font-family: 'Lato', sans-serif;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  .accent-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, #A5C49A, #CFE7B2 40%, #E7A17A 70%, #A5C49A);
    z-index: 10;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 52px 44px 52px 44px;
    box-sizing: border-box;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-text-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .brand-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: #4B7A18;
    line-height: 1;
    letter-spacing: -0.3px;
  }
  .brand-sub {
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: #E7A17A;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .hook-group {
    flex-shrink: 0;
    margin-top: 22px;
  }
  .hook {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1.1;
    color: #3D2B1F;
    letter-spacing: -0.8px;
  }
  .hook .accent { color: #E7A17A; }
  .hook-sub {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #9A7E5C;
    margin-top: 9px;
    letter-spacing: 0.2px;
  }

  .spacer { flex: 1; min-height: 12px; }

  .cards-section {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
  }
  .card {
    flex: 1;
    background: rgba(165, 196, 154, 0.09);
    border-radius: 14px;
    border: 1px solid rgba(165, 196, 154, 0.28);
    padding: 16px 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .card-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #3D2B1F;
    text-align: center;
    line-height: 1.25;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(165,196,154,0.45), rgba(231,161,122,0.3), transparent);
    margin: 18px 0 15px;
    flex-shrink: 0;
  }

  .bottom-group {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .cta-block {
    width: 100%;
    background: rgba(165, 196, 154, 0.08);
    border: 1.5px solid #A5C49A;
    border-radius: 13px;
    display: flex;
    align-items: center;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .cta-icon-zone {
    width: 62px;
    min-height: 72px;
    background: #A5C49A;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cta-label-zone {
    flex: 1;
    padding: 12px 14px;
  }
  .cta-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: #A5C49A;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    line-height: 1;
  }
  .cta-subtitle {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: #9A7E5C;
    margin-top: 4px;
    line-height: 1.3;
  }
  .cta-count-zone {
    width: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 8px;
    flex-shrink: 0;
  }
  .cta-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #3D2B1F;
    line-height: 1;
  }
  .cta-unit {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: #9A7E5C;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 1px;
  }

  .qr-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }
  .qr-img { display: block; width: 158px; height: 158px; }
  .qr-url {
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #4B7A18;
    text-align: center;
  }
  .support-line {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: #9A7E5C;
    opacity: 0.5;
    text-align: center;
    margin-top: 5px;
  }
</style>
</head>
<body>
<div class="preview-scaler">
<div class="insert">

  <div class="accent-line"></div>

  <!-- Botanical background texture: delicate leaf outlines -->
  <svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
    <!-- Top right large leaf -->
    <path d="M590 0 C568 18, 548 55, 560 85 C575 95, 598 72, 600 45 Z" fill="#A5C49A" opacity="0.07"/>
    <path d="M600 10 C585 25, 570 50, 575 75" stroke="#A5C49A" stroke-width="1" fill="none" opacity="0.07"/>
    <!-- Top left leaf cluster -->
    <path d="M0 80 C15 60, 42 68, 38 98 C22 108, 0 95, 0 80Z" fill="#A5C49A" opacity="0.06"/>
    <path d="M0 108 C12 92, 35 95, 32 115 C18 120, 0 115, 0 108Z" fill="#CFE7B2" opacity="0.09"/>
    <!-- Mid-right small leaves -->
    <path d="M575 280 C582 268, 595 274, 592 288 C584 294, 572 288, 575 280Z" fill="#A5C49A" opacity="0.07"/>
    <path d="M570 310 C580 300, 593 307, 589 320 C580 325, 568 320, 570 310Z" fill="#CFE7B2" opacity="0.08"/>
    <!-- Mid-left small leaves -->
    <path d="M8 320 C14 310, 26 315, 24 328 C16 333, 6 328, 8 320Z" fill="#A5C49A" opacity="0.06"/>
    <path d="M5 350 C12 340, 25 346, 22 358 C14 364, 4 359, 5 350Z" fill="#CFE7B2" opacity="0.08"/>
    <!-- Lower right leaf -->
    <path d="M572 720 C582 706, 598 712, 595 728 C585 736, 570 730, 572 720Z" fill="#A5C49A" opacity="0.07"/>
    <path d="M580 750 C590 736, 600 742, 598 756 C590 762, 578 756, 580 750Z" fill="#CFE7B2" opacity="0.07"/>
    <!-- Lower left leaf -->
    <path d="M5 760 C14 746, 30 752, 27 767 C18 773, 4 768, 5 760Z" fill="#A5C49A" opacity="0.06"/>
    <!-- Very subtle organic wave lines lower section -->
    <path d="M0 820 Q100 808, 200 818 Q300 828, 400 815 Q500 803, 600 818" stroke="#CFE7B2" stroke-width="0.7" fill="none" opacity="0.18"/>
    <path d="M0 840 Q120 828, 240 840 Q360 852, 480 838 Q540 832, 600 840" stroke="#CFE7B2" stroke-width="0.6" fill="none" opacity="0.14"/>
    <!-- Tiny scattered petal shapes -->
    <ellipse cx="555" cy="440" rx="5" ry="8" transform="rotate(-20 555 440)" fill="#A5C49A" opacity="0.07"/>
    <ellipse cx="42" cy="490" rx="4" ry="7" transform="rotate(15 42 490)" fill="#A5C49A" opacity="0.06"/>
    <ellipse cx="560" cy="580" rx="4" ry="7" transform="rotate(-35 560 580)" fill="#CFE7B2" opacity="0.08"/>
    <ellipse cx="38" cy="620" rx="5" ry="8" transform="rotate(25 38 620)" fill="#A5C49A" opacity="0.06"/>
  </svg>

  <div class="content">

    <!-- Logo -->
    <div class="logo-area">
      <!-- Simplified bird-and-leaf mark in brand colors -->
      <svg width="38" height="36" viewBox="0 0 38 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
        <!-- Large green leaf -->
        <ellipse cx="20" cy="13" rx="9" ry="13" transform="rotate(-18 20 13)" fill="#5C9B20" opacity="0.88"/>
        <!-- Lighter inner vein -->
        <path d="M14 18 C17 14, 21 12, 23 10" stroke="#FDFAF6" stroke-width="0.8" fill="none" opacity="0.5"/>
        <!-- Small mint leaf right -->
        <ellipse cx="27" cy="16" rx="5" ry="8" transform="rotate(-38 27 16)" fill="#CFE7B2" opacity="0.9"/>
        <!-- Terracotta small leaf bottom left -->
        <ellipse cx="12" cy="22" rx="4" ry="6" transform="rotate(22 12 22)" fill="#E7A17A" opacity="0.75"/>
        <!-- Earth brown tiny leaf -->
        <ellipse cx="18" cy="27" rx="3" ry="5" transform="rotate(8 18 27)" fill="#9A7E5C" opacity="0.65"/>
        <!-- Gold bird body hint -->
        <ellipse cx="16" cy="9" rx="5" ry="7" transform="rotate(-10 16 9)" fill="#F0A800" opacity="0.8"/>
        <!-- Bird eye -->
        <circle cx="14" cy="7" r="1" fill="#FDFAF6" opacity="0.9"/>
      </svg>
      <div class="logo-text-group">
        <span class="brand-name">natissy</span>
        <span class="brand-sub">by nature</span>
      </div>
    </div>

    <!-- Hook -->
    <div class="hook-group">
      <div class="hook">One mistake<br><span class="accent">shortens these</span><br>by years.</div>
      <div class="hook-sub">Scan for your free 5-tip care guide.</div>
    </div>

    <div class="spacer"></div>

    <!-- 3 care tip cards -->
    <div class="cards-section">

      <!-- Card 1: Cold Wash Only -->
      <div class="card">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Water drop shape -->
          <path d="M22 6 C22 6, 12 19, 12 26 C12 32.6, 16.5 37, 22 37 C27.5 37, 32 32.6, 32 26 C32 19, 22 6, 22 6Z" fill="#A5C49A" fill-opacity="0.15" stroke="#A5C49A" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- Highlight -->
          <path d="M16.5 24 C17.5 20, 20 18.5, 22 18.5" stroke="#A5C49A" stroke-width="1.4" stroke-linecap="round"/>
          <!-- Snowflake arms (cold indicator) at top -->
          <line x1="22" y1="2" x2="22" y2="6" stroke="#A5C49A" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="18.5" y1="2.8" x2="20" y2="5.3" stroke="#A5C49A" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="25.5" y1="2.8" x2="24" y2="5.3" stroke="#A5C49A" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="card-label">Cold Wash<br>Only</span>
      </div>

      <!-- Card 2: No Softener -->
      <div class="card">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Leaf shape -->
          <path d="M22 7 C13 11, 9 21, 13 29 C17 37, 27 37, 31 29 C35 21, 31 11, 22 7Z" fill="#A5C49A" fill-opacity="0.15" stroke="#A5C49A" stroke-width="1.8"/>
          <!-- Center vein -->
          <path d="M22 7 L22 37" stroke="#A5C49A" stroke-width="1.4" stroke-linecap="round"/>
          <!-- Side veins -->
          <path d="M22 18 L16 22" stroke="#A5C49A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
          <path d="M22 18 L28 22" stroke="#A5C49A" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
          <!-- No / X in terracotta corner -->
          <circle cx="33" cy="33" r="7" fill="#FDFAF6" stroke="#E7A17A" stroke-width="1.5"/>
          <line x1="29.5" y1="29.5" x2="36.5" y2="36.5" stroke="#E7A17A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="36.5" y1="29.5" x2="29.5" y2="36.5" stroke="#E7A17A" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="card-label">Skip the<br>Softener</span>
      </div>

      <!-- Card 3: Sun Dry -->
      <div class="card">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Sun circle -->
          <circle cx="22" cy="22" r="8.5" fill="#A5C49A" fill-opacity="0.18" stroke="#A5C49A" stroke-width="1.8"/>
          <!-- Sun rays -->
          <line x1="22" y1="5" x2="22" y2="10" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="22" y1="34" x2="22" y2="39" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="5" y1="22" x2="10" y2="22" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="34" y1="22" x2="39" y2="22" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="10.2" y1="10.2" x2="13.8" y2="13.8" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="30.2" y1="30.2" x2="33.8" y2="33.8" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="33.8" y1="10.2" x2="30.2" y2="13.8" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="13.8" y1="30.2" x2="10.2" y2="33.8" stroke="#A5C49A" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="card-label">Dry in<br>Sunlight</span>
      </div>

    </div>

    <div class="divider"></div>

    <!-- Bottom group -->
    <div class="bottom-group">

      <!-- CTA block -->
      <div class="cta-block">
        <div class="cta-icon-zone">
          <!-- Guide/book icon in bg color on sage -->
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="3" width="16" height="21" rx="2" fill="#FDFAF6" opacity="0.95"/>
            <rect x="10" y="3" width="16" height="21" rx="2" fill="#FDFAF6" opacity="0.55"/>
            <line x1="7.5" y1="10" x2="17" y2="10" stroke="#A5C49A" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="7.5" y1="14" x2="17" y2="14" stroke="#A5C49A" stroke-width="1.6" stroke-linecap="round"/>
            <line x1="7.5" y1="18" x2="14" y2="18" stroke="#A5C49A" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="cta-label-zone">
          <div class="cta-title">Get Your Guide</div>
          <div class="cta-subtitle">5 care tips for liners that last 8 years</div>
        </div>
        <div class="cta-count-zone">
          <span class="cta-num">5</span>
          <span class="cta-unit">TIPS</span>
        </div>
      </div>
